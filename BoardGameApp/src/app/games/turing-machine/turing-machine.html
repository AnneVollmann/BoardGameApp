<section class="game-page">
    <header>
        <div class="header-btns">
            <button>
                <a routerLink="/">
                    <img src="/img/btn-arrow-back.svg" alt="button-back">
                </a>
            </button>
            <button (click)="confirmDelete ? deleteGame() : askDelete()">
                <img
                    [src]="confirmDelete
                        ? '/img/btn-trash.svg'
                        : '/img/btn-x.svg'"
                    [alt]="confirmDelete
                        ? 'delete'
                        : 'confirm-delete'"
                >
            </button>
        </div>

        <div class="game-overview">
            <img class="tm-logo" src="/img/turing-machine.png" alt="turing-machine-logo">
            <app-game-information
                [name]="game.name"
                [gameNumber]="game.gameNumber"
                (nameChange)="game.name = $event; saveGame()"
                (gameNumberChange)="game.gameNumber = $event; saveGame()"
            />
        </div>
    </header>

    <div class="code-tests">
        <app-code-table [codeTests]="game.codeTests" (codeTestsChange)="game.codeTests = $event; saveGame()" />

        <app-test-table [codeTests]="game.codeTests" (codeTestsChange)="game.codeTests = $event; saveGame()" />

        <app-possible-digits [codeDigits]="game.codeDigits" (codeDigitsChange)="game.codeDigits = $event; saveGame()" />
    </div>

    <app-notes [notes]="game.notes" (noteChange)="game.notes = $event; saveGame()" />

</section>
