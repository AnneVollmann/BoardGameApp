<div class="test-note">
    <div class="letter">
        <span>{{note().letter}}</span>
    </div>
    <div class="notes">
        <textarea
            [value]="note().notes"
            (input)="updateNotes($event)"
        ></textarea>
        <div class="solution">
            <img class="tm-digit-icon" src="icons/tm-checkbox-checked-icon.svg" alt="checkbox checked icon">
            <input
                type="text"
                [value]="note().resolution"
                (input)="updateResolution($event)"
            >
        </div>
    </div>
</div>
