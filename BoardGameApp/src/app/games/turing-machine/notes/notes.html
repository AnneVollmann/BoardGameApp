<table>
  <tbody>
    @for (row of [0, 2, 4]; track row) {
      <tr>
        @for (note of notes().slice(row, row + 2); track note.letter) {
          <td>
            <app-test-note
              [note]="note"
              (noteChange)="updateNote(notes().indexOf(note), $event)"
            />
          </td>
        }
      </tr>
    }
  </tbody>
</table>
