<table>
    <thead>
        <tr>
            @for (column of columns; track column) {
            <th>{{column}}</th>
            }
        </tr>
    </thead>

    <tbody>
        @for (row of rows; track row) {
        <tr>
            @for (column of columns; track column) {
                <td>
                    <input type="checkbox">
                </td>
            }
        </tr>
        }
    </tbody>
</table>
