<section class="game-page">

    <header>
        <div class="header-btns">
            <button>
                <a routerLink="/">
                    <img src="/img/btn-arrow-back.svg" alt="button-back">
                </a>
            </button>
            <!-- <button (click)="confirmDelete ? deleteGame() : askDelete()">
                <img
                    [src]="confirmDelete
                        ? '/img/btn-trash.svg'
                        : '/img/btn-x.svg'"
                    [alt]="confirmDelete
                        ? 'delete'
                        : 'confirm-delete'"
                >
            </button> -->
        </div>

        <h1>FLÜGELSCHLAG</h1>
    </header>

    <table class="scoring-table">
        <thead>
            <td></td>
            <td>
                <input type="text" class="font-bold">
            </td>
            <td><input type="text" class="font-bold"></td>
        </thead>
        <tbody>
            @for (categorie of scoringCategories; track $index) {
                <tr>
                    <td>{{categorie}}</td>
                    <td><input type="number"></td>
                    <td><input type="number"></td>
                </tr>
            }
            <tr class="font-bold">
                <td>GESAMT</td>
                <td><input type="number" class="font-bold"></td>
                <td><input type="number" class="font-bold"></td>
            </tr>
        </tbody>
    </table>
</section>
